<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Visual countdown showing remaining time in 2026 with an interactive pixel grid display. Track hours and percentage remaining in real-time.">
    <meta name="theme-color" content="#050505">
    <meta name="author" content="Uday Mehta">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="2026 Remaining (IST)">
    <meta property="og:description" content="Visual countdown showing remaining time in 2026">
    <meta property="og:type" content="website">

    <title>2026 Remaining (IST)</title>
    <!-- 
        2026 Remaining (IST) App
        
        A visual countdown showing the remaining time in 2026.
        - All calculations use Asia/Kolkata (IST) timezone
        - 365 interactive particles form the "2026" display
        - Real-time progress updates every second
    -->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=VT323&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="scanlines"></div>
    <main>
        <section id="hero">
            <h1 class="visually-hidden">2026</h1>
            <!-- Container for the 365 particles forming '2026' -->
            <div id="year-container"></div>

            <div id="counters">
                <div class="counter-item">
                    <div id="loader-days" class="loader-wrapper">
                        <!-- Pixel Ring generated by JS -->
                        <div id="days-left" class="counter-val">0</div>
                    </div>
                    <div class="counter-label">Days Remaining</div>
                </div>

                <div class="counter-item">
                    <div id="loader-percent" class="loader-wrapper">
                        <!-- Pixel Ring generated by JS -->
                        <div id="percent-left" class="counter-val">0%</div>
                    </div>
                    <div class="counter-label">Percent Left</div>
                </div>
            </div>
        </section>
        <!-- Bottom grid removed as per request -->
    </main>
    <script src="app.js"></script>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
