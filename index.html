<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Remaining (IST)</title>
    <!-- 
        2026 Remaining (IST) App
        
        Logic:
        - All time calculations are pinned to Asia/Kolkata (IST).
        - Start: 2026-01-01T00:00:00 IST
        - End: 2027-01-01T00:00:00 IST
        - The '2026' visual is rendered via HTML5 Canvas, masking a dynamic grid inside the text.
        - The day grid is a collection of 365 div elements.
    -->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=VT323&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="scanlines"></div>
    <main>
        <section id="hero">
            <h1 class="visually-hidden">2026</h1>
            <!-- Container for the 365 particles forming '2026' -->
            <div id="year-container"></div>

            <div id="counters">
                <div class="counter-item">
                    <div id="loader-hours" class="loader-wrapper">
                        <!-- Pixel Ring generated by JS -->
                        <div id="hours-left" class="counter-val">0</div>
                    </div>
                    <div class="counter-label">Hours Remaining</div>
                </div>

                <div class="counter-item">
                    <div id="loader-percent" class="loader-wrapper">
                        <!-- Pixel Ring generated by JS -->
                        <div id="percent-left" class="counter-val">0%</div>
                    </div>
                    <div class="counter-label">Percent Left</div>
                </div>
            </div>
        </section>
        <!-- Bottom grid removed as per request -->
    </main>
    <script src="app.js"></script>
</body>

</html>
