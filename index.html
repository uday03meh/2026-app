    <title>2026 Remaining (IST)</title>
    <!-- 
        2026 Remaining (IST) App
        
        A visual countdown showing the remaining time in 2026.
        - All calculations use Asia/Kolkata (IST) timezone
        - 365 interactive particles form the "2026" display
        - Real-time progress updates every second
    -->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=VT323&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="scanlines"></div>
    <main>
        <section id="hero">
            <h1 class="visually-hidden">2026</h1>
            <!-- Container for the 365 particles forming '2026' -->
            <div id="year-container"></div>

            <div id="counters">
                <div class="counter-item">
                    <div id="loader-days" class="loader-wrapper">
                        <!-- Pixel Ring generated by JS -->
                        <div id="days-left" class="counter-val">0</div>
                    </div>
                    <div class="counter-label">Days Remaining</div>
                </div>

                <div class="counter-item">
                    <div id="loader-hours" class="loader-wrapper">
                        <!-- Pixel Ring generated by JS -->
                        <div id="hours-left" class="counter-val">0</div>
                    </div>
                    <div class="counter-label">Hours Left Today</div>
                </div>

                <div class="counter-item">
                    <div id="loader-percent" class="loader-wrapper">
                        <!-- Pixel Ring generated by JS -->
                        <div id="percent-left" class="counter-val">0%</div>
                    </div>
                    <div class="counter-label">Percent Left</div>
                </div>
            </div>
        </section>
        <!-- Bottom grid removed as per request -->
    </main>
    <script src="app.js"></script>
